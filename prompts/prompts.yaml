    - Relate observations to the small pool fire simulation context provided
    - Be quantitative when possible (e.g., "strong primary vortex", "well-developed corner eddies", "clear recirculation zone")
    - Identify both positive aspects and potential issues in small pool fire flow patterns
    - Adapt analysis depth and focus based on the Reynolds number and small pool fire geometry

