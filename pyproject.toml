[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-scientist"
version = "0.1.0"
description = "Agentic CFD scientist workflow orchestrated by LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-aws>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "semanticscholar>=0.7.0",
    "pyvista>=0.44",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "boto3>=1.34.0",
    "claude-agent-sdk>=0.1.61",
    "deepagents>=0.7.6",
    "psutil>=7.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "prompt_toolkit>=3.0.43",
]

[project.scripts]
cfd-scientist = "cfd_langgraph.workflow.main:main"
cfd-scientist-cli = "cfd_langgraph.cli.repl:main"

[tool.setuptools.packages.find]
where = ["src"]
