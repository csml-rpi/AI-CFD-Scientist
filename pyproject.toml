[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-langchain"
version = "0.1.0"
description = "LangChain modular CFD scientist agents"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-aws>=0.2.0",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pyvista>=0.44",
    "matplotlib>=3.8",
]

[project.scripts]
cfd-scientist = "cfd_langchain.workflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]
